[project]
name = "interlock-control-plane"
version = "1.0.1"
description = "Interlock - an oversight and containment control plane for autonomous agents operating on Google Cloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["ai-agents", "agent-safety", "guardrails", "google-adk", "blast-radius", "prompt-injection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "google-adk>=1.0.0",
  "google-genai>=1.0.0",
  "google-cloud-firestore>=2.19.0",
  "google-cloud-pubsub>=2.23.0",
  "google-cloud-logging>=3.11.0",
  "google-cloud-monitoring>=2.22.0",
  "google-cloud-run>=0.10.0",
  "google-cloud-secret-manager>=2.20.0",
  "google-cloud-storage>=2.18.0",
  "google-cloud-compute>=1.19.0",
  "google-api-python-client>=2.140.0",
  "google-auth>=2.35.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-gcp-trace>=1.7.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "cryptography>=43.0.0",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "python-dateutil>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/tanwar-div/interlock-agent-control-plane"
Repository = "https://github.com/tanwar-div/interlock-agent-control-plane"

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["interlock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PERF", "RUF"]
ignore = [
  # A governance plane fails closed, which means catching everything a
  # dependency might raise and converting it into a refusal. Narrowing these
  # would let an unanticipated exception escape and skip the gate.
  "BLE001",
  # Deliberate silent fallbacks on optional telemetry and state writes, where
  # failing loudly would take down the request path that carries the decision.
  "S110",
  "E501",   # long lines are almost all prose in explanatory comments
  # Our enums subclass (str, Enum) deliberately: pydantic serialisation and the
  # Firestore round-trip depend on that behaviour, and switching to StrEnum is a
  # behavioural change we have no reason to take.
  "UP042",
  # Prose in docstrings and tool descriptions uses typographic punctuation
  # deliberately; those strings are read by people and by models, not parsed.
  "RUF001", "RUF002", "RUF003",
  "PERF401", "PERF102", "SIM105", "SIM102", "E701", "UP031", "RUF046", "RUF059",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on behaviour, not style.
"tests/*" = ["S101", "PERF", "SIM"]
"evals/*" = ["E402"]
# Tests deliberately set environment before importing the module under test,
# which is the behaviour being tested.
"interlock-mcp/tests/*" = ["E402", "S101"]
