<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" width="1080" height="700" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
  </marker>
  <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
  </marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
  </marker>
  <style>
    .t{font-size:13px;fill:#0f172a;font-weight:600}
    .s{font-size:11px;fill:#475569}
    .m{font-size:10px;fill:#64748b;font-family:ui-monospace,Menlo,Consolas,monospace}
    .hd{font-size:11px;fill:#94a3b8;font-weight:700;letter-spacing:1.2px}
    .lbl{font-size:10px;font-weight:700;letter-spacing:.5px}
  </style>
</defs>

<rect width="1080" height="700" fill="#f8fafc"/>
<text x="34" y="38" font-size="19" font-weight="700" fill="#0f172a">Interlock — agent oversight and containment control plane</text>
<text x="34" y="58" class="s">Every action an agent takes is authenticated, scored, refused and recorded before it can reach infrastructure.</text>

<!-- WORKER PLANE -->
<rect x="34" y="82" width="472" height="298" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="52" y="106" class="hd">CALLERS — the SRE fleet, or anyone's agent</text>

<rect x="52" y="120" width="200" height="52" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
<text x="64" y="140" class="t">Cloud Monitoring alert</text>
<text x="64" y="157" class="m">5xx rate above threshold</text>

<rect x="52" y="186" width="200" height="46" rx="7" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="64" y="205" class="t">Pub/Sub</text>
<text x="64" y="221" class="m">interlock-alerts</text>

<rect x="278" y="120" width="210" height="230" rx="7" fill="#fafafa" stroke="#e2e8f0"/>
<text x="292" y="141" class="hd">ADK AGENTS</text>
<rect x="292" y="150" width="182" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="303" y="167" class="t">Triage</text><text x="303" y="181" class="m">ceiling NEGLIGIBLE</text>
<rect x="292" y="196" width="182" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="303" y="213" class="t">Investigator</text><text x="303" y="227" class="m">ceiling LOW · read-only</text>
<rect x="292" y="242" width="182" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="303" y="259" class="t">Remediation</text><text x="303" y="273" class="m">ceiling HIGH</text>
<rect x="292" y="288" width="182" height="46" rx="6" fill="#faf5ff" stroke="#d8b4fe"/>
<text x="303" y="305" class="t">Independent Auditor</text>
<text x="303" y="319" class="m">no shared context</text>
<text x="303" y="331" class="m">read-only · ceiling LOW</text>

<text x="52" y="252" class="s">One Pub/Sub message per phase, so an</text>
<text x="52" y="267" class="s">incident can span hours on scale-to-zero.</text>

<rect x="52" y="280" width="200" height="46" rx="7" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="64" y="299" class="t">Any agent · MCP</text>
<text x="64" y="315" class="m">Claude Code · Cursor · CI · yours</text>

<rect x="52" y="334" width="200" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="64" y="351" class="t">Gemini 3.5 Flash</text>
<text x="64" y="365" class="m">reasoning + audit</text>

<line x1="152" y1="172" x2="152" y2="184" stroke="#64748b" marker-end="url(#a)"/>
<line x1="252" y1="209" x2="290" y2="209" stroke="#64748b" marker-end="url(#a)"/>

<!-- GOVERNANCE PLANE -->
<rect x="530" y="82" width="300" height="404" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
<text x="548" y="106" class="hd" fill="#0f172a">GOVERNANCE PLANE</text>
<text x="548" y="122" class="m">ADK BasePlugin on the Runner</text>
<text x="548" y="136" class="m">before_tool_callback returns → tool never runs</text>

<rect x="548" y="150" width="264" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="560" y="167" class="t">1 · Identity</text>
<text x="560" y="182" class="m">Ed25519 proposal + signed agent card</text>

<rect x="548" y="198" width="264" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="560" y="215" class="t">2 · Capability</text>
<text x="560" y="230" class="m">tool allowlist + severity ceiling</text>

<rect x="548" y="246" width="264" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="560" y="263" class="t">3 · Blast radius</text>
<text x="560" y="278" class="m">Gemini scores; catalogue floors it</text>
<text x="560" y="291" class="m">model may raise a score, never lower one</text>

<rect x="548" y="304" width="264" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="560" y="321" class="t">4 · Content inspection</text>
<text x="560" y="336" class="m">Model Armor + Gemma + heuristics</text>
<text x="560" y="349" class="m">guard model ≠ reasoning model</text>

<rect x="548" y="362" width="264" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="560" y="379" class="t">5 · Policy engine</text>
<text x="560" y="394" class="m">11 ordered, named, auditable rules</text>

<rect x="548" y="410" width="264" height="58" rx="6" fill="#f0fdf4" stroke="#86efac"/>
<text x="560" y="427" class="t">6 · Hash-chained ledger</text>
<text x="560" y="442" class="m">every entry signed, links to predecessor</text>
<text x="560" y="456" class="m">edit or removal breaks the chain</text>

<path d="M488 235 C 512 235, 512 200, 546 200" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="470" y="215" class="m" fill="#0f172a">tool call</text>
<polyline points="252,303 266,303 266,368 520,368 520,300 528,300" fill="none"
          stroke="#6366f1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="290" y="363" class="m" fill="#6366f1">same fuse · stdio</text>

<!-- OUTCOMES -->
<text x="866" y="106" class="hd">OUTCOME</text>
<rect x="866" y="150" width="182" height="52" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
<text x="878" y="169" class="lbl" fill="#16a34a">ALLOW</text>
<text x="878" y="186" class="m">tool executes on live infra</text>
<line x1="814" y1="176" x2="864" y2="176" stroke="#16a34a" marker-end="url(#ag)"/>

<rect x="866" y="216" width="182" height="62" rx="7" fill="#fefce8" stroke="#ca8a04"/>
<text x="878" y="235" class="lbl" fill="#ca8a04">REQUIRE APPROVAL</text>
<text x="878" y="252" class="m">parked; incident sleeps</text>
<text x="878" y="265" class="m">until a human decides</text>
<line x1="814" y1="247" x2="864" y2="247" stroke="#ca8a04" marker-end="url(#aw)"/>

<rect x="866" y="292" width="182" height="62" rx="7" fill="#fef2f2" stroke="#dc2626"/>
<text x="878" y="311" class="lbl" fill="#dc2626">DENY</text>
<text x="878" y="328" class="m">never executes; agent is</text>
<text x="878" y="341" class="m">told, and cannot retry</text>
<line x1="814" y1="323" x2="864" y2="323" stroke="#dc2626" marker-end="url(#ar)"/>

<!-- PERSISTENCE -->
<rect x="34" y="392" width="472" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="52" y="416" class="hd">DURABLE STATE — Firestore</text>
<rect x="52" y="428" width="140" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="63" y="445" class="t">incidents</text><text x="63" y="460" class="m">state machine</text>
<rect x="200" y="428" width="140" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="211" y="445" class="t">checkpoints</text><text x="211" y="460" class="m">phase-level resume</text>
<rect x="348" y="428" width="140" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="359" y="445" class="t">ledger</text><text x="359" y="460" class="m">signed chain</text>
<rect x="52" y="478" width="140" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="63" y="495" class="t">agent registry</text><text x="63" y="510" class="m">identity cards</text>
<rect x="200" y="478" width="140" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="211" y="495" class="t">approvals</text><text x="211" y="510" class="m">human decisions</text>
<rect x="348" y="478" width="140" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="359" y="495" class="t">proposals</text><text x="359" y="510" class="m">scored actions</text>

<path d="M676 470 C 676 508, 560 508, 506 500" fill="none" stroke="#64748b" stroke-dasharray="4 3" marker-end="url(#a)"/>

<!-- RESILIENCE -->
<rect x="530" y="500" width="518" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="548" y="524" class="hd">RESILIENCE</text>
<text x="548" y="543" class="s">Process dies mid-incident → a different instance reads the last checkpoint and resumes</text>
<text x="548" y="560" class="s">from that phase. Work already completed is not repeated; applied changes are not re-applied.</text>

<!-- OBSERVABILITY -->
<rect x="34" y="556" width="472" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="52" y="580" class="hd">OBSERVABILITY — Cloud Trace + OpenTelemetry</text>
<text x="52" y="601" class="s">OpenTelemetry spans following GenAI semantic conventions: every agent run,</text>
<text x="52" y="618" class="s">model call and tool execution — policy decisions sit in the same trace as the</text>
<text x="52" y="635" class="s">call they prevented.</text>
<text x="52" y="648" class="m">Gemini 3.5 Flash · Gemma 4 · gemini-embedding-001 · ADK · Cloud Run · Cloud SQL</text>
<text x="52" y="662" class="m">Firestore · Pub/Sub · Cloud Scheduler · Model Armor · Secret Manager</text>

<rect x="530" y="592" width="518" height="76" rx="10" fill="#0f172a"/>
<text x="548" y="618" font-size="12" font-weight="700" fill="#f8fafc">The property the system rests on</text>
<text x="548" y="639" font-size="11" fill="#cbd5e1">A disallowed action does not execute. Not "is warned about" — does not run.</text>
<text x="548" y="657" font-size="11" fill="#94a3b8">The agent is not consulted, so it cannot argue past the fuse.</text>
</svg>
